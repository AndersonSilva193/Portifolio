<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-1-tela.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@800&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f4f2f1}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1344px">
  <div class="r-brand region text" data-region="brand"><!-- wordmark Anderson Silva, bold near-black sans --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-nav region control" data-region="nav"><!-- three nav links Sites, Sistemas, Contato: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav); a control need not have button chrome --></div>
  <div class="r-cta-whatsapp region control" data-region="cta-whatsapp"><!-- black pill button with WhatsApp glyph, Falar no WhatsApp: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta-whatsapp); a control need not have button chrome --></div>
  <div class="r-headline region text" data-region="headline"><!-- huge tight bold headline Sites com a cara do seu negócio. --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-subline region text" data-region="subline"><!-- one-line subheading in regular weight --><p style="font-size:var(--r-subline-font);line-height:1.05;margin:0">subline</p></div>
  <div class="r-screen-frame region chrome" data-region="screen-frame"><!-- thin near-black rounded screen bezel with soft long shadow --></div>
  <figure class="r-screen-site region plate" data-region="screen-site"><img src="../../../assets/plates/screen-site.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-caption region text" data-region="caption"><!-- caption Açaí do GQ. Cliente real. Visitar o site with underlined link --><p style="font-size:var(--r-caption-font);line-height:1.05;margin:0">caption</p></div>
</main>
</body>
</html>
